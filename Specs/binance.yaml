                      required:
                      - entryPrice
                      - markPrice
                      - positionAmt
                      - symbol
                      - unRealizedProfit
                required:
                - assets
                - position
              type:
                type: string
                example: futures
              updateTime:
                type: integer
                format: int64
                example: 1576281599000
            required:
            - data
            - type
            - updateTime
      required:
      - code
      - msg
      - snapshotVos
