openapi: 3.0.2
info:
  title: Binance Spot API
  description: "OpenAPI Specifications for the Binance Public Spot API\n\nAPI documents:\n  - [https://github.com/binance/binance-spot-api-docs](https://github.com/binance/binance-spot-api-docs)\n  - [https://binance-docs.github.io/apidocs/spot/en](https://binance-docs.github.io/apidocs/spot/en)\n\nThis file is a curated subset of the official binance/binance-api-swagger spot_api.yaml, scoped to the Market and Wallet tags only (byte-identical operation/schema/parameter definitions, reduced scope for a right-sized reference spec)."
  version: '1.0'
servers:
- url: https://api.binance.com
- url: https://testnet.binance.vision
security: []
tags:
- name: Market
  description: Market Data
- name: Wallet
  description: Wallet Endpoints
paths:
  /api/v3/ping:
    get:
      summary: Test Connectivity
      description: 'Test connectivity to the Rest API.


        Weight(IP): 1'
      tags:
      - Market
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/v3/time:
    get:
      summary: Check Server Time
      description: 'Test connectivity to the Rest API and get the current server time.


        Weight(IP): 1'
      tags:
      - Market
      responses:
        '200':
          description: Binance server UTC timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime:
                    type: integer
                    format: int64
                    example: 1499827319559
                required:
                - serverTime
  /api/v3/exchangeInfo:
    get:
      summary: Exchange Information
      description: "Current exchange trading rules and symbol information\n\n- If any symbol provided in either symbol or symbols do not exist, the endpoint will throw an error.\n- All parameters are optional.\n- permissions can support single or multiple values (e.g. SPOT, [\"MARGIN\",\"LEVERAGED\"])\n- If permissions parameter not provided, the default values will be [\"SPOT\",\"MARGIN\",\"LEVERAGED\"].\n  - To display all permissions you need to specify them explicitly. (e.g. SPOT, MARGIN,...)\n\nExamples of Symbol Permissions Interpretation from the Response:\n- [[\"A\",\"B\"]] means you may place an order if your account has either permission \"A\" or permission \"B\".\n- [[\"A\"],[\"B\"]] means you can place an order if your account has permission \"A\" and permission \"B\".\n- [[\"A\"],[\"B\",\"C\"]] means you can place an order if your account has permission \"A\" and permission \"B\" or permission \"C\". (Inclusive or is applied here, not exclusive or, so your account may have both permission \"B\" and permission \"C\".)\n\nWeight(IP): 10"
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      - $ref: '#/components/parameters/permissions'
      responses:
        '200':
          description: Current exchange trading rules and symbol information
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    example: UTC
                  serverTime:
                    type: integer
                    format: int64
                    example: 1592882214236
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          format: int32
                          example: 1
                        limit:
                          type: integer
                          format: int32
                          example: 1200
                      required:
                      - rateLimitType
                      - interval
                      - intervalNum
                      - limit
                  exchangeFilters:
                    type: array
                    items:
                      type: object
                  symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: ETHBTC
                        status:
                          type: string
                          example: TRADING
                        baseAsset:
                          type: string
                          example: ETH
                        baseAssetPrecision:
                          type: integer
                          format: int32
                          example: 8
                        quoteAsset:
                          type: string
                          example: BTC
                        quoteAssetPrecision:
                          type: integer
                          format: int32
                          example: 8
                        baseCommissionPrecision:
                          type: integer
                          format: int32
                          example: 8
                        quoteCommissionPrecision:
                          type: integer
                          format: int32
                          example: 8
                        orderTypes:
                          type: array
                          items:
                            type: string
                            example: LIMIT
                        icebergAllowed:
                          type: boolean
                          example: true
                        ocoAllowed:
                          type: boolean
                          example: true
                        otoAllowed:
                          type: boolean
                          example: false
                        quoteOrderQtyMarketAllowed:
                          type: boolean
                          example: true
                        allowTrailingStop:
                          type: boolean
                          example: false
                        cancelReplaceAllowed:
                          type: boolean
                          example: true
                        isSpotTradingAllowed:
                          type: boolean
                          example: true
                        isMarginTradingAllowed:
                          type: boolean
                          example: true
                        filters:
                          type: array
                          items:
                            type: object
                            properties:
                              filterType:
                                type: string
                                example: PRICE_FILTER
                              minPrice:
                                type: string
                                example: '0.00000100'
                              maxPrice:
                                type: string
                                example: '100000.00000000'
                              tickSize:
                                type: string
                                example: '0.00000100'
                            required:
                            - filterType
                            - minPrice
                            - maxPrice
                            - tickSize
                        permissions:
                          type: array
                          items:
                            type: string
                            example: SPOT
                        permissionSets:
                          type: array
                          items:
                            type: array
                            items:
                              type: string
                              example:
                              - SPOT
                              - MARGIN
                        defaultSelfTradePreventionMode:
                          type: string
                          example: NONE
                        allowedSelfTradePreventionModes:
                          type: array
                          items:
                            type: string
                            example: NONE
                      required:
                      - symbol
                      - status
                      - baseAsset
                      - baseAssetPrecision
                      - quoteAsset
                      - quoteAssetPrecision
                      - baseCommissionPrecision
                      - quoteCommissionPrecision
                      - orderTypes
                      - icebergAllowed
                      - ocoAllowed
                      - otoAllowed
                      - quoteOrderQtyMarketAllowed
                      - allowTrailingStop
                      - cancelReplaceAllowed
                      - isSpotTradingAllowed
                      - isMarginTradingAllowed
                      - filters
                      - permissions
                      - permissionSets
                      - defaultSelfTradePreventionMode
                      - allowedSelfTradePreventionModes
                required:
                - timezone
                - serverTime
                - rateLimits
                - exchangeFilters
                - symbols
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/depth:
    get:
      summary: Order Book
      description: '| Limit               | Weight(IP)  |

        |---------------------|-------------|

        | 1-100               | 5           |

        | 101-500             | 25          |

        | 501-1000            | 50          |

        | 1001-5000           | 250         |'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - name: limit
        in: query
        description: If limit > 5000, then the response will truncate to 5000
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 5000
          example: 100
      responses:
        '200':
          description: Order book
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastUpdateId:
                    type: integer
                    format: int64
                  bids:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                        minItems: 2
                        maxItems: 2
                  asks:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                        minItems: 2
                        maxItems: 2
                required:
                - lastUpdateId
                - bids
                - asks
              example:
                lastUpdateId: 1027024
                bids:
                - - '4.00000000'
                  - '431.00000000'
                asks:
                - - '4.00000200'
                  - '12.00000000'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/trades:
    get:
      summary: Recent Trades List
      description: 'Get recent trades.


        Weight(IP): 10'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trade'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/historicalTrades:
    get:
      summary: Old Trade Lookup
      description: 'Get older market trades.


        Weight(IP): 10'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/fromId'
      responses:
        '200':
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trade'
  /api/v3/aggTrades:
    get:
      summary: Compressed/Aggregate Trades List
      description: "Get compressed, aggregate trades. Trades that fill at the time, from the same order, with the same price will have the quantity aggregated.\n- If `fromId`, `startTime`, and `endTime` are not sent, the most recent aggregate trades will be returned.\n- Note that if a trade has the following values, this was a duplicate aggregate trade and marked as invalid:\n\n  p = '0' // price\n\n  q = '0' // qty\n\n  f = -1 // ﬁrst_trade_id\n\n  l = -1 // last_trade_id\n\nWeight(IP): 2"
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/fromId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/aggTrade'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/klines:
    get:
      summary: Kline/Candlestick Data
      description: 'Kline/candlestick bars for a symbol.

        Klines are uniquely identified by their open time.


        - If `startTime` and `endTime` are not sent, the most recent klines are returned.


        Weight(IP): 2'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - name: interval
        in: query
        required: true
        description: kline intervals
        schema:
          type: string
          enum:
          - 1s
          - 1m
          - 3m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 6h
          - 8h
          - 12h
          - 1d
          - 3d
          - 1w
          - 1M
          example: '"1m"'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - name: timeZone
        in: query
        required: false
        description: 'Default: 0 (UTC)'
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Kline data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                      format: int64
                    - type: string
                    minItems: 12
                    maxItems: 12
                  example:
                  - 1499040000000
                  - '0.01634790'
                  - '0.80000000'
                  - '0.01575800'
                  - '0.01577100'
                  - '148976.11427815'
                  - 1499644799999
                  - '2434.19055334'
                  - 308
                  - '1756.87402397'
                  - '28.46694368'
                  - '17928899.62484339'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/uiKlines:
    get:
      summary: UIKlines
      description: 'The request is similar to klines having the same parameters and response.


        uiKlines return modified kline data, optimized for presentation of candlestick charts.


        Weight(IP): 2'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      - name: interval
        in: query
        required: true
        description: kline intervals
        schema:
          type: string
          enum:
          - 1s
          - 1m
          - 3m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 6h
          - 8h
          - 12h
          - 1d
          - 3d
          - 1w
          - 1M
          example: '"1m"'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - name: timeZone
        in: query
        required: false
        description: 'Default: 0 (UTC)'
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: UIKline data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                      format: int64
                    - type: string
                    minItems: 12
                    maxItems: 12
                  example:
                  - 1499040000000
                  - '0.01634790'
                  - '0.80000000'
                  - '0.01575800'
                  - '0.01577100'
                  - '148976.11427815'
                  - 1499644799999
                  - '2434.19055334'
                  - 308
                  - '1756.87402397'
                  - '28.46694368'
                  - '0'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/avgPrice:
    get:
      summary: Current Average Price
      description: 'Current average price for a symbol.


        Weight(IP): 2'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/symbol'
      responses:
        '200':
          description: Average price
          content:
            application/json:
              schema:
                type: object
                properties:
                  mins:
                    type: integer
                    format: int64
                    example: 5
                    description: Average price interval (in minutes)
                  price:
                    type: string
                    example: '9.35751834'
                    description: Average price
                  closeTime:
                    type: integer
                    format: int64
                    example: 1694061154503
                    description: Last trade time
                required:
                - mins
                - price
                - closeTime
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/ticker/24hr:
    get:
      summary: 24hr Ticker Price Change Statistics
      description: '24 hour rolling window price change statistics. Careful when accessing this with no symbol.


        - If the symbol is not sent, tickers for all symbols will be returned in an array.


        Weight(IP):

        - `2` for a single symbol;

        - `80` when the symbol parameter is omitted;'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      - $ref: '#/components/parameters/tickerType'
      responses:
        '200':
          description: 24hr ticker
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ticker'
                - $ref: '#/components/schemas/tickerList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/ticker/tradingDay:
    get:
      summary: Trading Day Ticker
      description: "Price change statistics for a trading day.\n\nNotes:\n- Supported values for timeZone:\n  - Hours and minutes (e.g. -1:00, 05:45)\n  - Only hours (e.g. 0, 8, 4)\n\nWeight:\n- `4` for each requested symbol.\n- The weight for this request will cap at `200` once the number of symbols in the request is more than `50`."
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      - name: timeZone
        in: query
        required: false
        description: 'Default: 0 (UTC)'
        schema:
          type: string
      - $ref: '#/components/parameters/tickerType'
      responses:
        '200':
          description: Trading day ticker
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/dayTicker'
                - $ref: '#/components/schemas/dayTickerList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/ticker/price:
    get:
      summary: Symbol Price Ticker
      description: 'Latest price for a symbol or symbols.


        - If the symbol is not sent, prices for all symbols will be returned in an array.


        Weight(IP):

        - `2` for a single symbol;

        - `4` when the symbol parameter is omitted;'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      responses:
        '200':
          description: Price ticker
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/priceTicker'
                - $ref: '#/components/schemas/priceTickerList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/ticker/bookTicker:
    get:
      summary: Symbol Order Book Ticker
      description: 'Best price/qty on the order book for a symbol or symbols.


        - If the symbol is not sent, bookTickers for all symbols will be returned in an array.


        Weight(IP):

        - `2` for a single symbol;

        - `4` when the symbol parameter is omitted;'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      responses:
        '200':
          description: Order book ticker
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/bookTicker'
                - $ref: '#/components/schemas/bookTickerList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /api/v3/ticker:
    get:
      summary: Rolling window price change statistics
      description: 'The window used to compute statistics is typically slightly wider than requested windowSize.


        openTime for /api/v3/ticker always starts on a minute, while the closeTime is the current time of the request. As such, the effective window might be up to 1 minute wider than requested.


        E.g. If the closeTime is 1641287867099 (January 04, 2022 09:17:47:099 UTC) , and the windowSize is 1d. the openTime will be: 1641201420000 (January 3, 2022, 09:17:00 UTC)


        Weight(IP): 4 for each requested symbol regardless of windowSize.


        The weight for this request will cap at 200 once the number of symbols in the request is more than 50.'
      tags:
      - Market
      parameters:
      - $ref: '#/components/parameters/optionalSymbol'
      - $ref: '#/components/parameters/arraySymbols'
      - name: windowSize
        in: query
        description: 'Defaults to 1d if no parameter provided.

          Supported windowSize values:

          1m,2m....59m for minutes

          1h, 2h....23h - for hours

          1d...7d - for days.


          Units cannot be combined (e.g. 1d2h is not allowed)'
        schema:
          type: string
      - name: type
        in: query
        description: 'Supported values: FULL or MINI.

          If none provided, the default is FULL'
        schema:
          type: string
      responses:
        '200':
          description: Rolling price ticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    example: BNBBTC
                  priceChange:
                    type: string
                    example: '-8.00000000'
                  priceChangePercent:
                    type: string
                    example: '-88.889'
                  weightedAvgPrice:
                    type: string
                    example: '2.60427807'
                  openPrice:
                    type: string
                    example: '9.00000000'
                  highPrice:
                    type: string
                    example: '9.00000000'
                  lowPrice:
                    type: string
                    example: '1.00000000'
                  lastPrice:
                    type: string
                    example: '1.00000000'
                  volume:
                    type: string
                    example: '187.00000000'
                  quoteVolume:
                    type: string
                    example: '487.00000000'
                  openTime:
                    type: integer
                    format: int64
                    example: 1641859200000
                  closeTime:
                    type: integer
                    format: int64
                    example: 1642031999999
                  firstId:
                    type: integer
                    format: int64
                    example: 0
                  lastId:
                    type: integer
                    format: int64
                    example: 60
                  count:
                    type: integer
                    format: int64
                    example: 61
                required:
                - symbol
                - priceChange
                - priceChangePercent
                - weightedAvgPrice
                - openPrice
                - highPrice
                - lowPrice
                - lastPrice
                - volume
                - quoteVolume
                - openTime
                - closeTime
                - firstId
                - lastId
                - count
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /sapi/v1/system/status:
    get:
      summary: System Status (System)
      description: 'Fetch system status.


        Weight(IP): 1'
      tags:
      - Wallet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                    example: 0
                    description: '0: normal, 1：system maintenance'
                  msg:
                    type: string
                    example: normal
                    description: '"normal", "system_maintenance"'
                required:
                - status
                - msg
  /sapi/v1/capital/config/getall:
    get:
      summary: All Coins' Information (USER_DATA)
      description: 'Get information of coins (available for deposit and withdraw) for user.


        Weight(IP): 10'
      tags:
      - Wallet
      parameters:
      - $ref: '#/components/parameters/recvWindow'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/signature'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: All coins details information
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    coin:
                      type: string
                      example: BTC
                    depositAllEnable:
                      type: boolean
                    free:
                      type: string
                      example: '0.00000000'
                    freeze:
                      type: string
                      example: '0.00000000'
                    ipoable:
                      type: string
                      example: '0.00000000'
                    ipoing:
                      type: string
                      example: '0.00000000'
                    isLegalMoney:
                      type: boolean
                      example: false
                    locked:
                      type: string
                      example: '0.00000000'
                    name:
                      type: string
                      example: Bitcoin
                    networkList:
                      type: array
                      items:
                        type: object
                        properties:
                          addressRegex:
                            type: string
                            example: ^(bnb1)[0-9a-z]{38}$
                          coin:
                            type: string
                            example: BTC
                          depositDesc:
                            type: string
                            example: Wallet Maintenance, Deposit Suspended
                            description: shown only when "depositEnable" is false.
                          depositEnable:
                            type: boolean
                            example: false
                          isDefault:
                            type: boolean
                            example: false
                          memoRegex:
                            type: string
                            example: ^[0-9A-Za-z\-_]{1,120}$
                          minConfirm:
                            type: integer
                            format: int64
                            example: 1
                            description: min number for balance confirmation.
                          name:
                            type: string
                            example: BEP2
                          network:
                            type: string
                            example: ETH
                          specialTips:
                            type: string
                            example: Both a MEMO and an Address are required to successfully deposit your BEP2-BTCB tokens to Binance.
                          unLockConfirm:
                            type: integer
                            format: int64
                            example: 0
                            description: confirmation number for balance unlock.
                          withdrawDesc:
                            type: string
                            example: Wallet Maintenance, Withdrawal Suspended
                            description: shown only when "withdrawEnable" is false
                          withdrawEnable:
                            type: boolean
                            example: false
