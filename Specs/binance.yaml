components:
  parameters:
    asset:
      name: asset
      in: query
      required: true
      schema:
        type: string
        example: BTC
    amount:
      name: amount
      in: query
      required: true
      schema:
        type: number
        format: double
        example: '1.01'
    current:
      name: current
      in: query
      description: Current querying page. Start from 1. Default:1
      schema:
        type: integer
        format: int32
        example: 1
    optionalCoin:
      name: coin
      in: query
      description: Coin name
      schema:
        type: string
        example: BNB
    coin:
      name: coin
      in: query
      required: true
      description: Coin name
      schema:
        type: string
        example: BNB
    size:
      name: size
      in: query
      description: Default:10 Max:100
      schema:
        type: integer
        format: int32
        example: 100
    symbol:
      name: symbol
      in: query
      required: true
      description: Trading symbol, e.g. BNBUSDT
      schema:
        type: string
        example: BNBUSDT
    optionalSymbol:
      name: symbol
      in: query
      description: Trading symbol, e.g. BNBUSDT
      schema:
        type: string
        example: BNBUSDT
    optionalAsset:
      name: asset
      in: query
      schema:
        type: string
        example: BNB
    limit:
      name: limit
      in: query
      description: Default 500; max 1000.
      schema:
        type: integer
        format: int32
        example: 5
    fromId:
      name: fromId
      in: query
      description: Trade id to fetch from. Default gets most recent trades.
      schema:
        type: integer
        format: int64
    offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int32
    startTime:
      name: startTime
      in: query
      description: UTC timestamp in ms
      schema:
        type: integer
        format: int64
    endTime:
      name: endTime
      in: query
      description: UTC timestamp in ms
      schema:
        type: integer
        format: int64
    recvWindow:
      name: recvWindow
      in: query
      description: The value cannot be greater than 60000
      schema:
        type: integer
        format: int64
        example: 5000
    timestamp:
      name: timestamp
      in: query
      required: true
      description: UTC timestamp in ms
      schema:
        type: integer
        format: int64
    univTransferType:
      name: type
      in: query
      required: true
      description: Universal transfer type
      schema:
        type: string
        enum:
        - MAIN_C2C
        - MAIN_UMFUTURE
        - MAIN_CMFUTURE
        - MAIN_MARGIN
        - MAIN_MINING
        - C2C_MAIN
        - C2C_UMFUTURE
        - C2C_MINING
        - C2C_MARGIN
        - UMFUTURE_MAIN
        - UMFUTURE_C2C
        - UMFUTURE_MARGIN
        - CMFUTURE_MAIN
        - CMFUTURE_MARGIN
        - MARGIN_MAIN
        - MARGIN_UMFUTURE
        - MARGIN_CMFUTURE
        - MARGIN_MINING
        - MARGIN_C2C
        - MINING_MAIN
        - MINING_UMFUTURE
        - MINING_C2C
        - MINING_MARGIN
        - MAIN_PAY
        - PAY_MAIN
        - ISOLATEDMARGIN_MARGIN
        - MARGIN_ISOLATEDMARGIN
        - ISOLATEDMARGIN_ISOLATEDMARGIN
        example: MAIN_C2C
    signature:
      name: signature
      in: query
      required: true
      description: Signature
      schema:
        type: string
    arraySymbols:
      name: symbols
      in: query
      schema:
        type: string
        example: '["BTCUSDT","BNBBTC"]'
    tickerType:
      name: type
      in: query
      description: 'Supported values: FULL or MINI.

        If none provided, the default is FULL'
      schema:
        type: string
        enum:
        - FULL
        - MINI
        example: FULL
    permissions:
      name: permissions
      in: query
      schema:
        type: string
        example: '''SPOT'' or [''MARGIN'',''LEVERAGED'']'
    needBtcValuation:
      name: needBtcValuation
      in: query
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    fromSymbol:
      name: fromSymbol
      in: query
      description: Must be sent when type are ISOLATEDMARGIN_MARGIN and ISOLATEDMARGIN_ISOLATEDMARGIN
      schema:
        type: string
        example: BNBUSDT
    toSymbol:
      name: toSymbol
      in: query
      description: Must be sent when type are MARGIN_ISOLATEDMARGIN and ISOLATEDMARGIN_ISOLATEDMARGIN
      schema:
        type: string
        example: BNBUSDT
    network:
      name: network
      in: query
      required: false
      schema:
        type: string
        example: BTC
  schemas:
    bookTickerList:
      type: array
      items:
        $ref: '#/components/schemas/bookTicker'
    bookTicker:
      type: object
      properties:
        symbol:
          type: string
          example: BNBBTC
        bidPrice:
          type: string
          example: '16.36240000'
        bidQty:
          type: string
          example: '256.78000000'
        askPrice:
          type: string
          example: '16.36450000'
        askQty:
          type: string
          example: '12.56000000'
      required:
      - symbol
      - bidPrice
      - bidQty
      - askPrice
      - askQty
    priceTickerList:
      type: array
      items:
        $ref: '#/components/schemas/priceTicker'
    priceTicker:
      type: object
      properties:
        symbol:
          type: string
          example: BNBBTC
        price:
          type: string
          example: '0.17160000'
      required:
      - symbol
      - price
    tickerList:
      type: array
      items:
        $ref: '#/components/schemas/ticker'
    ticker:
      type: object
      properties:
        symbol:
          type: string
          example: BNBBTC
        priceChange:
          type: string
          example: '0.17160000'
        priceChangePercent:
          type: string
          example: '1.060'
        prevClosePrice:
          type: string
          example: '16.35920000'
        lastPrice:
          type: string
          example: '27.84000000'
        bidPrice:
          type: string
          example: '16.34488284'
        bidQty:
          type: string
          example: '16.34488284'
        askPrice:
          type: string
          example: '16.35920000'
        askQty:
          type: string
          example: '25.06000000'
        openPrice:
          type: string
          example: '16.18760000'
        highPrice:
          type: string
          example: '16.55000000'
        lowPrice:
          type: string
          example: '16.16940000'
        volume:
          type: string
          example: '1678279.95000000'
        quoteVolume:
          type: string
          example: '27431289.14792300'
        openTime:
          type: integer
          format: int64
          example: 1592808788637
        closeTime:
          type: integer
          format: int64
          example: 1592895188637
        firstId:
          type: integer
          format: int64
          example: 62683296
        lastId:
          type: integer
          format: int64
          example: 62739253
        count:
          type: integer
          format: int64
          example: 55958
      required:
      - symbol
      - priceChange
      - priceChangePercent
      - prevClosePrice
      - lastPrice
      - bidPrice
      - bidQty
      - askPrice
      - askQty
      - openPrice
      - highPrice
      - lowPrice
      - volume
      - quoteVolume
      - openTime
      - closeTime
      - firstId
      - lastId
      - count
    dayTickerList:
      type: array
      items:
        $ref: '#/components/schemas/dayTicker'
    dayTicker:
      type: object
      properties:
        symbol:
          type: string
          example: BTCUSDT
        priceChange:
          type: string
          example: '-83.13000000'
          description: Absolute price change
        priceChangePercent:
          type: string
          example: '-0.317'
          description: Relative price change in percent
        weightedAvgPrice:
          type: string
          example: '26234.58803036'
          description: quoteVolume / volume
        openPrice:
          type: string
          example: '26304.80000000'
        highPrice:
          type: string
          example: '26397.46000000'
        lowPrice:
          type: string
          example: '26088.34000000'
        lastPrice:
          type: string
          example: '26221.67000000'
        volume:
          type: string
          description: Volume in base asset
          example: '18495.35066000'
        quoteVolume:
          type: string
          example: '485217905.04210480'
          description: Volume in quote asset
        openTime:
          type: integer
          format: int64
          example: 1695686400000
        closeTime:
          type: integer
          format: int64
          example: 1695772799999
        firstId:
          type: integer
          format: int64
          example: 3220151555
          description: Trade ID of the first trade in the interval
        lastId:
          type: integer
          format: int64
          example: 3220849281
          description: Trade ID of the last trade in the interval
        count:
          type: integer
          format: int64
          example: 697727
          description: Number of trades in the interval
      required:
      - symbol
      - priceChange
      - priceChangePercent
      - weightedAvgPrice
      - openPrice
      - highPrice
      - lowPrice
      - lastPrice
      - volume
      - quoteVolume
      - openTime
      - closeTime
      - firstId
      - lastId
      - count
    trade:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: trade id
          example: 345196462
        price:
          type: string
          description: price
          example: '9638.99000000'
        qty:
          type: string
          description: amount of base asset
          example: '0.02077200'
        quoteQty:
          type: string
          description: amount of quote asset
          example: '0.02077200'
        time:
          type: integer
          format: int64
          description: Trade executed timestamp, as same as `T` in the stream
          example: 1592887772684
        isBuyerMaker:
          type: boolean
        isBestMatch:
          type: boolean
      required:
      - id
      - price
      - qty
      - quoteQty
      - time
      - isBuyerMaker
      - isBestMatch
    aggTrade:
      type: object
      properties:
        a:
          type: integer
          format: int64
          description: Aggregate tradeId
          example: 26129
        p:
          type: string
          description: Price
          example: '0.01633102'
        q:
          type: string
          description: Quantity
          example: '4.70443515'
        f:
          type: integer
          format: int64
          description: First tradeId
          example: 27781
        l:
          type: integer
          format: int64
          description: Last tradeId
          example: 27781
        T:
          type: boolean
          description: Timestamp
          example: 1498793709153
        m:
          type: boolean
          description: Was the buyer the maker?
        M:
          type: boolean
          description: Was the trade the best price match?
      required:
      - a
      - p
      - q
      - f
      - l
      - T
      - m
      - M
    snapshotSpot:
      type: object
      properties:
        code:
          type: integer
          format: int64
          example: 200
        msg:
          type: string
          example: ''
        snapshotVos:
          type: array
          items:
            type: object
            properties:
              data:
                type: object
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: BTC
                        free:
                          type: string
                          example: '0.2'
                        locked:
                          type: string
                          example: '0.001'
                      required:
                      - asset
                      - free
                      - locked
                  totalAssetOfBtc:
                    type: string
                    example: '0.09905021'
                required:
                - balances
                - totalAssetOfBtc
              type:
                type: string
                example: spot
              updateTime:
                type: integer
                format: int64
                example: 1576281599000
            required:
            - data
            - type
            - updateTime
      required:
      - code
      - msg
      - snapshotVos
    snapshotMargin:
      type: object
      properties:
        code:
          type: integer
          format: int64
          example: 200
        msg:
          type: string
          example: ''
        snapshotVos:
          type: array
          items:
            type: object
            properties:
              data:
                type: object
                properties:
                  marginLevel:
                    type: string
                    example: '2748.02909813'
                  totalAssetOfBtc:
                    type: string
                    example: '0.00274803'
                  totalLiabilityOfBtc:
                    type: string
                    example: '0.00000100'
                  totalNetAssetOfBtc:
                    type: string
                    example: '0.00274750'
                  userAssets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: XRP
                        borrowed:
                          type: string
                          example: '0.00000000'
                        free:
                          type: string
                          example: '1.00000000'
                        interest:
                          type: string
                          example: '0.00000000'
                        locked:
                          type: string
                          example: '0.00000000'
                        netAsset:
                          type: string
                          example: '1.00000000'
                      required:
                      - asset
                      - borrowed
                      - free
                      - interest
                      - locked
                      - netAsset
                required:
                - marginLevel
                - totalAssetOfBtc
                - totalLiabilityOfBtc
                - totalNetAssetOfBtc
                - userAssets
              type:
                type: string
                example: margin
              updateTime:
                type: integer
                format: int64
                example: 1576281599000
            required:
            - data
            - type
            - updateTime
      required:
      - code
      - msg
      - snapshotVos
    snapshotFutures:
      type: object
      properties:
        code:
          type: integer
          format: int64
          example: 200
        msg:
          type: string
          example: ''
        snapshotVos:
          type: array
          items:
            type: object
            properties:
              data:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: USDT
                        marginBalance:
                          type: string
                          example: '118.99782335'
                        walletBalance:
                          type: string
                          example: '120.23811389'
                      required:
                      - asset
                      - marginBalance
                      - walletBalance
                  position:
                    type: array
                    items:
                      type: object
                      properties:
                        entryPrice:
                          type: string
                          example: '7130.41000000'
                        markPrice:
                          type: string
                          example: '7257.66239673'
                        positionAmt:
                          type: string
                          example: '0.01000000'
                        symbol:
                          type: string
                          example: BTCUSDT
