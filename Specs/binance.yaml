  /sapi/v1/capital/withdraw/history:
    get:
      summary: Withdraw History (supporting network) (USER_DATA)
      description: 'Fetch withdraw history.


        This endpoint specifically uses per second UID rate limit, user''s total second level IP rate limit is 180000/second. Response from the endpoint contains header key X-SAPI-USED-UID-WEIGHT-1S, which defines weight used by the current IP.


        - `network` may not be in the response for old withdraw.

        - Please notice the default `startTime` and `endTime` to make sure that time interval is within 0-90 days.

        - If both `startTime` and `endTime` are sent, time between `startTime` and `endTime` must be less than 90 days

        - If withdrawOrderId is sent, time between startTime and endTime must be less than 7 days.

        - If withdrawOrderId is sent, startTime and endTime are not sent, will return last 7 days records by default.


        Weight(UID): 18000

        Request Limit: 10 requests per second'
      tags:
      - Wallet
      parameters:
      - $ref: '#/components/parameters/optionalCoin'
      - name: withdrawOrderId
        in: query
        schema:
          type: string
      - name: status
        in: query
        description: '* `0` - Email Sent

          * `1` - Cancelled

          * `2` - Awaiting Approval

          * `3` - Rejected

          * `4` - Processing

          * `5` - Failure

          * `6` - Completed'
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/recvWindow'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/signature'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: List of withdraw history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    address:
                      type: string
                      example: '0x94df8b352de7f46f64b01d3666bf6e936e44ce60'
                    amount:
                      type: string
                      example: '8.91000000'
                    applyTime:
                      type: string
                      example: '2019-10-12 11:12:02'
                    coin:
                      type: string
                      example: USDT
                    id:
                      type: string
                      example: b6ae22b3aa844210a7041aee7589627c
                    withdrawOrderId:
                      type: string
                      example: WITHDRAWtest123
                      description: will not be returned if there's no withdrawOrderId for this withdraw.
                    network:
                      type: string
                      example: ETH
                    transferType:
                      type: integer
                      format: int32
                      example: 0
                      description: 1 for internal transfer, 0 for external transfer
                    status:
                      type: integer
                      format: int32
                      example: 6
                    transactionFee:
                      type: string
                      example: '0.004'
                    confirmNo:
                      type: integer
                      format: int32
                      example: 3
                    info:
                      type: string
                      example: The address is not valid. Please confirm with the recipient
                      description: Reason for withdrawal failure
                    txId:
                      type: string
                      example: '0xb5ef8c13b968a406cc62a93a8bd80f9e9a906ef1b3fcf20a2e48573c17659268'
                  required:
                  - address
                  - amount
                  - applyTime
                  - coin
                  - id
                  - withdrawOrderId
                  - network
                  - transferType
                  - status
                  - transactionFee
                  - txId
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
